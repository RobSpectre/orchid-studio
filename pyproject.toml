[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-studio"
version = "0.1.0"
description = "Software performance project for Orchid MIDI and Pistil laptop audio"
requires-python = ">=3.10"

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5.8,<2"]

[project.scripts]
orchid-studio = "orchid_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
